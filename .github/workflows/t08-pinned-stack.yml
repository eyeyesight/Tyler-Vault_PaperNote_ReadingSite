name: T08 pinned-stack Linux gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t08-pinned-stack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-pinned-stack:
    name: Ubuntu pinned-stack acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out exact pull-request bytes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install exact Node toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.0
          cache: npm

      - name: Verify the evidence-generating toolchain
        run: |
          test "$(node --version)" = "v22.23.0"
          test "$(npm --version)" = "10.9.8"

      - name: Capture a clean immutable checkout
        run: |
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "T08_CHECKOUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install the exact locked dependency graph
        run: npm ci

      - name: Prove install did not rewrite reviewed inputs
        run: |
          test "$(git rev-parse HEAD)" = "$T08_CHECKOUT_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Emit temporary expanded-tree diagnostic
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto"
          import { lstat, readFile, readdir } from "node:fs/promises"
          import path from "node:path"
          import { fileURLToPath } from "node:url"
          import { gzipSync } from "node:zlib"
          const sha256 = (bytes) => createHash("sha256").update(bytes).digest("hex")
          async function inventory(root) {
            const files = []
            async function walk(directory) {
              const entries = await readdir(directory, { withFileTypes: true })
              entries.sort((left, right) => Buffer.compare(Buffer.from(left.name), Buffer.from(right.name)))
              for (const entry of entries) {
                const absolute = path.join(directory, entry.name)
                const metadata = await lstat(absolute)
                if (metadata.isSymbolicLink()) throw new Error(`unexpected link: ${entry.name}`)
                if (metadata.isDirectory()) await walk(absolute)
                else if (metadata.isFile()) {
                  const bytes = await readFile(absolute)
                  files.push({ path: path.relative(root, absolute).split(path.sep).join("/"), sha256: sha256(bytes), bytes: bytes.length })
                } else throw new Error(`unexpected entry: ${entry.name}`)
              }
            }
            await walk(root)
            const rows = files.map((file) => `${file.path}\0${file.sha256}\n`)
            return { count: files.length, sha256: sha256(Buffer.from(rows.join(""))), files }
          }
          const quartzRoot = path.dirname(fileURLToPath(import.meta.resolve("@jackyzha0/quartz/package.json")))
          const communityRoot = path.resolve(quartzRoot, "..", "..", "@quartz-community")
          const payload = { quartz: await inventory(quartzRoot), community: await inventory(communityRoot) }
          console.log(`T08_TREE_SUMMARY=${JSON.stringify({ quartz: { count: payload.quartz.count, sha256: payload.quartz.sha256 }, community: { count: payload.community.count, sha256: payload.community.sha256 } })}`)
          const encoded = gzipSync(Buffer.from(JSON.stringify(payload))).toString("base64")
          const chunks = encoded.match(/.{1,4000}/g) ?? []
          chunks.forEach((chunk, index) => console.log(`T08_TREE_MANIFEST_CHUNK=${index + 1}/${chunks.length}:${chunk}`))
          NODE

      - name: Select the runner Chromium browser
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$browser"
          echo "TYLER_TRACER_BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"
          "$browser" --version

      - name: Read back advisories and dependency graph
        run: |
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
          npm ls sharp brace-expansion minimatch serve-handler

      - name: Validate bridge ownership and compatibility
        run: |
          node --test tests/security-stack.test.mjs
          npm run typecheck

      - name: Build and verify the synthetic production site
        run: |
          mkdir -p "$RUNNER_TEMP/canonical-vault"
          node scripts/site.mjs build --vault-root "$RUNNER_TEMP/canonical-vault"
          node scripts/site.mjs verify --vault-root "$RUNNER_TEMP/canonical-vault"

      - name: Run the complete regression and headless browser acceptance suite
        run: npm test

      - name: Generate and parse the exact-stack SBOM
        run: |
          npm sbom --package-lock-only --sbom-format=cyclonedx > "$RUNNER_TEMP/t08-sbom.cdx.json"
          node -e 'const fs=require("node:fs"); const data=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/t08-sbom.cdx.json","utf8")); if (!Array.isArray(data.components) || data.components.length === 0) process.exit(1); console.log(`SBOM_COMPONENTS=${data.components.length}`)'

      - name: Prove acceptance left reviewed source unchanged
        run: |
          test "$(git rev-parse HEAD)" = "$T08_CHECKOUT_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
