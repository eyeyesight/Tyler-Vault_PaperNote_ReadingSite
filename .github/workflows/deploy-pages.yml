name: Deploy GitHub Pages exact site commit

on:
  workflow_dispatch:
    inputs:
      site_commit:
        description: Exact lowercase 40-hex commit from refs/heads/gh-pages
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Enforce main-only dispatch
        env:
          WORKFLOW_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REF" != "refs/heads/main" || "$DEFAULT_BRANCH" != "main" ]]; then
            printf '%s\n' 'Pages deployment must use refs/heads/main and the default branch must be main' >&2
            exit 1
          fi

      - name: Validate site_commit
        env:
          SITE_COMMIT: ${{ inputs.site_commit }}
        run: |
          set -euo pipefail
          if [[ ! "$SITE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' 'site_commit must be exactly 40 lowercase hexadecimal characters' >&2
            exit 1
          fi

      - name: Checkout exact site commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.site_commit }}
          fetch-depth: 1
          path: candidate
          persist-credentials: false

      - name: Verify exact gh-pages site
        working-directory: candidate
        env:
          SITE_COMMIT: ${{ inputs.site_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SITE_COMMIT"
          # The exact SHA must be the current gh-pages commit or one of its ancestors.
          git fetch --no-tags --prune --unshallow origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
          git rev-parse --verify "$SITE_COMMIT^{commit}" >/dev/null
          git merge-base --is-ancestor "$SITE_COMMIT" refs/remotes/origin/gh-pages
          test -d site
          test -f site/index.html
          test -f site/404.html
          test -f site/.nojekyll
          test ! -s site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload exact Pages site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: candidate/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the exact Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
